<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff; --raise:#ffffff; --ink:#16181b; --ink-2:#33373d; --muted:#54595f;
  --line:#cfd4d9; --line-soft:#e3e7ea; --surface:#f3f5f7;
  --red:#c5221f; --red-bg:#fbe5e2; --red-ink:#98201d;
  --green:#0f7038; --green-bg:#dcf0e4; --green-ink:#0a5429;
  --blue:#1560cd;
  --gold:#f2b705; --on-gold:#3d2c00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --raise:#1c1f24; --ink:#edeff2; --ink-2:#ccd0d6; --muted:#a0a5ac;
    --line:#3d434a; --line-soft:#292e34; --surface:#1f2429;
    --red:#f4a49d; --red-bg:#40241f; --red-ink:#f4a49d;
    --green:#8ed4a2; --green-bg:#183527; --green-ink:#8ed4a2;
    --blue:#a1c1f9; --gold:#f5c93f;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --raise:#1c1f24; --ink:#edeff2; --ink-2:#ccd0d6; --muted:#a0a5ac;
  --line:#3d434a; --line-soft:#292e34; --surface:#1f2429;
  --red:#f4a49d; --red-bg:#40241f; --red-ink:#f4a49d;
  --green:#8ed4a2; --green-bg:#183527; --green-ink:#8ed4a2;
  --blue:#a1c1f9; --gold:#f5c93f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

.ribbon{display:flex;height:5px}
.ribbon i{flex:1}
.ribbon i:nth-child(1){background:var(--red)}
.ribbon i:nth-child(2){background:var(--green)}
.ribbon i:nth-child(3){background:var(--gold)}
.ribbon i:nth-child(4){background:var(--blue)}

.top{padding:22px 0 4px}
.back{display:inline-block;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:14px}
.step{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
  padding:4px 11px 4px 5px;border-radius:999px;background:var(--gold);color:var(--on-gold);margin-bottom:12px}
.step b{width:21px;height:21px;border-radius:50%;background:var(--on-gold);color:var(--gold);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.meta{margin-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:700;display:inline-block;min-width:38px}

.notice{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:700;
  background:var(--surface);border:1.5px dashed var(--line);color:var(--ink-2)}
.notice a{color:var(--blue);font-weight:700}

form{padding:22px 0 34px;display:flex;flex-direction:column;gap:18px}
label.f{display:flex;flex-direction:column;gap:6px}
label.f > span,.padhead span{font-size:14px;font-weight:700;color:var(--ink-2)}
input[type=text]{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--surface)}
input::placeholder{color:var(--muted);opacity:.85}

.grp{display:flex;flex-direction:column;gap:18px}
.lab{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:6px}

/* 구분 · 학년 — 큰 버튼형 라디오 */
.seg,.grades{display:grid;gap:8px}
.seg{grid-template-columns:1fr 1fr}
.grades{grid-template-columns:repeat(3,1fr)}
.seg label,.grades label{position:relative;display:block;cursor:pointer}
.seg input,.grades input{position:absolute;opacity:0;width:1px;height:1px}
.seg span,.grades span{display:flex;align-items:center;justify-content:center;
  min-height:52px;padding:10px;border-radius:11px;font-size:18px;font-weight:800;
  border:2px solid var(--line);background:var(--bg);color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s}
.seg input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grades input:checked + span{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.seg input:focus-visible + span,.grades input:focus-visible + span{outline:3px solid var(--blue);outline-offset:2px}

.padhead{display:flex;align-items:center;justify-content:space-between}
.clear{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:4px 13px;cursor:pointer}
.clear:hover{color:var(--ink-2);border-color:var(--ink-2)}
.padbox{position:relative;margin-top:6px;border-radius:12px;overflow:hidden;
  background:#ffffff;border:2px dashed #b9c0c7}
.padbox.on{border-style:solid;border-color:#5b6168}
#pad{display:block;width:100%;height:200px;touch-action:none;cursor:crosshair;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.padph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;color:#9aa1a8;font-size:17px;font-weight:700}
.padline{position:absolute;left:18px;right:18px;bottom:44px;border-bottom:1.5px solid #e1e5e9;pointer-events:none}
.padx{position:absolute;left:18px;bottom:48px;color:#b9c0c7;font-size:20px;font-weight:700;pointer-events:none}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.err{padding:12px 15px;border-radius:10px;font-size:15px;font-weight:700;
  background:var(--red-bg);color:var(--red-ink);border:1.5px solid var(--red)}

.submit{font:inherit;font-size:20px;font-weight:800;cursor:pointer;width:100%;
  padding:17px;border-radius:12px;border:2px solid var(--gold);background:var(--gold);color:var(--on-gold)}
.submit:disabled{opacity:.55;cursor:default}
.submit:focus-visible,.clear:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.done{padding:44px 0 60px;text-align:center}
.mark{width:70px;height:70px;border-radius:50%;margin:0 auto 20px;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
.done h2{font-size:28px;font-weight:800;margin-bottom:8px}
.done p{color:var(--ink-2)}
.done .no{margin-top:6px;font-size:14px;color:var(--muted)}
.next{display:inline-flex;align-items:center;gap:10px;margin-top:28px;text-decoration:none;
  font-size:18px;font-weight:800;padding:15px 26px;border-radius:12px;background:var(--gold);color:var(--on-gold)}
.next b{width:24px;height:24px;border-radius:50%;background:var(--on-gold);color:var(--gold);
  display:inline-flex;align-items:center;justify-content:center;font-size:13px}

footer{border-top:1px solid var(--line);padding:20px 0 36px;font-size:14px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>

<div class="ribbon"><i></i><i></i><i></i><i></i></div>

<header class="wrap top">
  <a class="back" href="./">← 공개수업 안내로</a><br>
  <span class="step"><b>1</b>참관 순서 첫 번째</span>
  <h1>서명부</h1>
  <p class="meta">
    <span><b>행사</b> 공개수업 (학부모 · RAS-Q · 과학실 · 질문)</span>
    <span><b>일시</b> 2026. 9. 22.(화)</span>
  </p>
  <p class="notice" id="notice" hidden>
    서명부를 준비하고 있습니다. 지금은
    <a href="https://script.google.com/macros/s/AKfycby6Bn35sU4Zi69jrqzM7wJG277NJH4oKYzWBLuFq7GhSwpVMLFXBnqR-Y43ahQeSjnA/exec?s=566700254" target="_blank" rel="noopener">이쪽에서 서명</a>해 주세요.
  </p>
</header>

<main class="wrap">
  <form id="form" novalidate>
    <div class="seg" role="radiogroup" aria-label="구분">
      <label><input type="radio" name="role" value="학부모" checked><span>학부모</span></label>
      <label><input type="radio" name="role" value="교원"><span>교원</span></label>
    </div>

    <div class="grp" id="asParent">
      <div>
        <p class="lab">학생 학년</p>
        <div class="grades" role="radiogroup" aria-label="학생 학년">
          <label><input type="radio" name="grade" value="1학년"><span>1학년</span></label>
          <label><input type="radio" name="grade" value="2학년"><span>2학년</span></label>
          <label><input type="radio" name="grade" value="3학년"><span>3학년</span></label>
        </div>
      </div>
      <label class="f"><span>학생 이름</span>
        <input type="text" id="student" maxlength="40" autocomplete="off" placeholder="자녀 이름">
      </label>
    </div>

    <div class="grp" id="asTeacher" hidden>
      <label class="f"><span>소속</span>
        <input type="text" id="org" maxlength="60" autocomplete="organization" placeholder="예) ○○중학교">
      </label>
      <label class="f"><span>성명</span>
        <input type="text" id="name" maxlength="40" autocomplete="name" placeholder="이름">
      </label>
    </div>

    <div>
      <div class="padhead">
        <span>서명</span>
        <button class="clear" type="button" id="clear">지우기</button>
      </div>
      <div class="padbox" id="padbox">
        <canvas id="pad" aria-label="서명을 그리는 칸"></canvas>
        <span class="padline" aria-hidden="true"></span>
        <span class="padx" aria-hidden="true">✕</span>
        <span class="padph" id="padph">손가락으로 여기에 서명해 주세요</span>
      </div>
    </div>

    <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

    <p class="err" id="err" role="alert" hidden></p>
    <button class="submit" type="submit" id="submit">서명 제출</button>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <div class="mark" aria-hidden="true">✓</div>
    <h2>서명되었습니다</h2>
    <p id="doneMsg">참석해 주셔서 고맙습니다.</p>
    <p class="no" id="doneNo"></p>
    <a class="next" href="./#classes"><b>2</b>수업 참관 — 우리 반 찾기 →</a>
  </section>
</main>

<footer class="wrap">경민여자중학교 · <a href="tel:031-828-7882">031-828-7882</a></footer>

<script>
(function () {
  /* ════ 연결 설정 ════════════════════════════
     서명부 Apps Script 웹 앱 주소를 따옴표 안에 넣으세요 (…/exec)
     ═══════════════════════════════════════ */
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzg8gJjIdcevDw_YYKq6P20nusDUP9QSVlxq-HuXq7P_PZWy5t8fqpYRcTPw4IPm6Z6/exec';

  var $form = document.getElementById('form');
  var $org = document.getElementById('org');
  var $name = document.getElementById('name');
  var $student = document.getElementById('student');
  var $asParent = document.getElementById('asParent');
  var $asTeacher = document.getElementById('asTeacher');

  function role() {
    var r = document.querySelector('input[name="role"]:checked');
    return r ? r.value : '학부모';
  }
  function grade() {
    var g = document.querySelector('input[name="grade"]:checked');
    return g ? g.value : '';
  }
  [].forEach.call(document.querySelectorAll('input[name="role"]'), function (el) {
    el.addEventListener('change', function () {
      var p = role() === '학부모';
      $asParent.hidden = !p;
      $asTeacher.hidden = p;
      showErr('');
    });
  });
  var $err = document.getElementById('err');
  var $submit = document.getElementById('submit');
  var $done = document.getElementById('done');

  if (!ENDPOINT) {
    document.getElementById('notice').hidden = false;
    $submit.disabled = true;
    $submit.textContent = '준비 중입니다';
  }

  /* 서버 미리 깨우기 — 제출할 때 기다리지 않도록 */
  var lastWarm = 0;
  function warm() {
    if (!ENDPOINT || Date.now() - lastWarm < 180000) return;
    lastWarm = Date.now();
    try { fetch(ENDPOINT, { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) {}
  }
  warm();
  document.addEventListener('focusin', warm);

  /* ── 서명 칸 ─────────────────────────── */
  var cv = document.getElementById('pad');
  var ctx = cv.getContext('2d');
  var box = document.getElementById('padbox');
  var ph = document.getElementById('padph');
  var INK = '#111418';
  var WIDTH = 2.8;                 // 화면 기준 선 굵기(px)
  var strokes = [];                // [[{x,y}, …], …] 화면 좌표(CSS px)
  var cur = null;
  var dpr = 1;

  function fit() {
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    redraw();
  }
  function pen(c, scale) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = INK; c.fillStyle = INK;
    c.lineWidth = Math.max(1.4, WIDTH * scale);
  }
  function drawPath(c, pts, scale, ox, oy) {
    if (!pts.length) return;
    pen(c, scale);
    var X = function (p) { return (p.x - ox) * scale; };
    var Y = function (p) { return (p.y - oy) * scale; };
    if (pts.length === 1) {
      c.beginPath(); c.arc(X(pts[0]), Y(pts[0]), c.lineWidth / 2, 0, Math.PI * 2); c.fill();
      return;
    }
    c.beginPath();
    c.moveTo(X(pts[0]), Y(pts[0]));
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      c.quadraticCurveTo(X(pts[i]), Y(pts[i]), (mx - ox) * scale, (my - oy) * scale);
    }
    var last = pts[pts.length - 1];
    c.lineTo(X(last), Y(last));
    c.stroke();
  }
  function redraw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < strokes.length; i++) drawPath(ctx, strokes[i], dpr, 0, 0);
  }
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function state() {
    var has = strokes.length > 0;
    ph.hidden = has;
    box.classList.toggle('on', has);
  }

  /* 캔버스 실제 크기가 화면 크기와 어긋나면 다시 맞춤 (그린 선은 보존됨) */
  function ensureSize() {
    var r = cv.getBoundingClientRect();
    if (r.width > 0 && Math.abs(cv.width - Math.round(r.width * dpr)) > 2) fit();
  }

  cv.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    ensureSize();
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    cur = [pt(e)];
    strokes.push(cur);
    state();
    redraw();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!cur) return;
    e.preventDefault();
    var list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
    for (var i = 0; i < list.length; i++) cur.push(pt(list[i]));
    // 마지막 몇 점만 다시 그려 가볍게
    var n = cur.length, from = Math.max(0, n - 4);
    drawPath(ctx, cur.slice(from), dpr, 0, 0);
  });
  function end() { if (cur) { cur = null; redraw(); } }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') end(); });

  document.getElementById('clear').addEventListener('click', function () {
    strokes = []; cur = null; redraw(); state();
  });

  var rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(fit, 120); });
  window.addEventListener('load', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  if ('ResizeObserver' in window) { new ResizeObserver(function () { ensureSize(); }).observe(cv); }
  fit();

  /* 서명이 제대로 그려졌는지 — 점 몇 개로는 부족 */
  function bounds() {
    var b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9, n: 0 };
    strokes.forEach(function (s) {
      s.forEach(function (p) {
        b.n++;
        if (p.x < b.x0) b.x0 = p.x; if (p.y < b.y0) b.y0 = p.y;
        if (p.x > b.x1) b.x1 = p.x; if (p.y > b.y1) b.y1 = p.y;
      });
    });
    return b;
  }
  function hasSignature() {
    var b = bounds();
    return b.n >= 8 && ((b.x1 - b.x0) > 24 || (b.y1 - b.y0) > 24);
  }

  /* 여백을 잘라내고 작게 줄여 PNG로 — 시트 한 칸(5만 자)에 들어가도록 */
  function exportPNG() {
    var b = bounds(), padPx = 10;
    var w = (b.x1 - b.x0) + padPx * 2, h = (b.y1 - b.y0) + padPx * 2;
    var scale = Math.min(1.6, 560 / w, 200 / h);
    var out = '';
    for (var tries = 0; tries < 8; tries++) {
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.ceil(w * scale));
      c.height = Math.max(1, Math.ceil(h * scale));
      var g = c.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, c.width, c.height);
      for (var i = 0; i < strokes.length; i++) drawPath(g, strokes[i], scale, b.x0 - padPx, b.y0 - padPx);
      out = c.toDataURL('image/png');
      if (out.length <= 40000) break;
      scale *= 0.8;
    }
    return out;
  }

  /* ── 제출 ────────────────────────────── */
  function showErr(m) { $err.textContent = m; $err.hidden = !m; }

  $form.addEventListener('submit', function (e) {
    e.preventDefault();
    showErr('');
    if (!ENDPOINT) return;

    var who = role();
    var g = grade(), student = $student.value.trim();
    var org = $org.value.trim(), name = $name.value.trim();
    if (who === '학부모') {
      if (!g)       { showErr('학생 학년을 골라 주세요.'); document.querySelector('input[name="grade"]').focus(); return; }
      if (!student) { showErr('학생 이름을 적어 주세요.'); $student.focus(); return; }
    } else {
      if (!org)  { showErr('소속 학교를 적어 주세요.'); $org.focus(); return; }
      if (!name) { showErr('성명을 적어 주세요.'); $name.focus(); return; }
    }
    if (!hasSignature()) { showErr('서명 칸에 손가락으로 서명해 주세요.'); box.scrollIntoView({ block: 'center' }); return; }

    var sig = exportPNG();
    $submit.disabled = true;
    $submit.textContent = '제출하는 중…';
    var slow = setTimeout(function () { $submit.textContent = '저장하는 중… 잠시만요'; }, 1500);

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        role: who,
        grade: who === '학부모' ? g : '',
        student: who === '학부모' ? student : '',
        org: who === '교원' ? org : '',
        name: who === '교원' ? name : '',
        sig: sig,
        website: document.getElementById('website').value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        clearTimeout(slow);
        if (!res || !res.ok) throw new Error((res && res.error) || '');
        /* 안내문 상단 '참관 순서'의 ① 서명부를 완료로 */
        try {
          var st = JSON.parse(localStorage.getItem('kmg-openclass-steps') || '{}') || {};
          st.s1 = true;
          localStorage.setItem('kmg-openclass-steps', JSON.stringify(st));
        } catch (x) {}
        document.getElementById('doneMsg').textContent = who === '학부모'
          ? g + ' ' + student + ' 학생 학부모님, 참석해 주셔서 고맙습니다.'
          : name + ' 선생님, 참석해 주셔서 고맙습니다.';
        document.getElementById('doneNo').textContent = res.no ? '서명 번호 ' + res.no : '';
        $form.hidden = true;
        $done.hidden = false;
        window.scrollTo(0, 0);
      })
      .catch(function (err) {
        clearTimeout(slow);
        showErr((err && err.message) || '제출하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.');
        $submit.disabled = false;
        $submit.textContent = '다시 제출';
      });
  });
})();
</script>
</body>
</html>
